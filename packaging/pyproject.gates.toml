# Example quality-gate tables for a consuming project's pyproject.toml
#
# Merge the sections you want. Paths assume an `app/` + `tests/` layout.
# Adjust coverage source / ty includes to match your tree.

[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4",
    "complexipy>=6.2.0",
    "coverage>=7.15.3",
    "hypothesis>=6.165.2",
    "mutmut>=3.7.0",
    "pre-commit>=4.6.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "radon>=6.0.1",
    "ruff>=0.16.1",
    "semgrep>=1.172.0",
    "ty>=0.0.68",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-n",
    "auto",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=90",
]
markers = [
    "hypothesis: property-based tests using Hypothesis",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app", "tests"]
fix = true

[tool.ruff.lint]
select = ["ALL"]
preview = true
fixable = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.complexipy]
paths = ["app", "tests"]
max-complexity-allowed = 10
failed = true

[tool.mutmut]
source_paths = ["app"]
pytest_add_cli_args = ["-o", "addopts=", "-q", "-x"]
pytest_add_cli_args_test_selection = ["tests/"]
